<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="logoTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <linearGradient id="logoEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="doiPot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <radialGradient id="doiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="100" height="100" rx="22" fill="#0B4635" />

  <!-- Terracotta Mandala Outer Ring -->
  <circle cx="50" cy="50" r="46" stroke="url(#logoGold)" stroke-width="1.6" stroke-dasharray="4 2.5" opacity="0.85" />
  <circle cx="50" cy="50" r="43" stroke="url(#logoEmerald)" stroke-width="1" opacity="0.6" />

  <!-- Mahasthangarh Ancient Stepped Terracotta Mound -->
  <path d="M 38 48 Q 58 35 78 44 L 84 66 L 32 66 Z" fill="url(#logoTerracotta)" opacity="0.9" />
  <path d="M 44 44 Q 58 36 72 42 L 75 52 L 41 52 Z" fill="#B45309" opacity="0.95" />
  <path d="M 50 38 Q 58 33 66 37 L 68 44 L 48 44 Z" fill="#F59E0B" opacity="0.9" />

  <!-- Satmatha Monument Roundabout & Pillar -->
  <ellipse cx="48" cy="70" rx="22" ry="7.5" fill="#1E293B" stroke="url(#logoGold)" stroke-width="1.2" />
  <ellipse cx="48" cy="70" rx="16" ry="5" fill="#0F172A" />
  <path d="M 45 42 L 51 42 L 52 65 L 44 65 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
  <ellipse cx="48" cy="42" rx="6" ry="2.2" fill="#E2E8F0" />
  <circle cx="48" cy="39" r="2.5" fill="url(#logoGold)" />
  <path d="M 40 50 L 44 50 L 44 65 L 39 65 Z" fill="#CBD5E1" />
  <path d="M 52 50 L 56 50 L 57 65 L 52 65 Z" fill="#CBD5E1" />

  <!-- Traditional Bogura Doi Clay Pot -->
  <g transform="translate(18, 62)">
    <path d="M 4 8 C 4 16, 26 16, 26 8 C 26 5, 4 5, 4 8 Z" fill="url(#doiPot)" stroke="#9A3412" stroke-width="0.8" />
    <ellipse cx="15" cy="7.5" rx="9.5" ry="3.8" fill="url(#doiGlow)" />
    <path d="M 13 4 Q 14 1 16 0.5" stroke="#FEF08A" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 17 4 Q 18 2 19 1" stroke="#FEF08A" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>

  <!-- Karatoya & Jamuna River Wave -->
  <path d="M 14 78 Q 28 72 42 78 T 72 77 T 90 81" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M 18 83 Q 32 78 46 83 T 76 82 T 86 86" stroke="url(#logoGold)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Top Star -->
  <path d="M 50 14 L 51.5 17.5 L 55 19 L 51.5 20.5 L 50 24 L 48.5 20.5 L 45 19 L 48.5 17.5 Z" fill="url(#logoGold)" />
</svg>

